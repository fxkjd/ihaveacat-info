name: Deploy

on: [push]

jobs:
  deploy:
    name: info.ihavea.cat
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to Server
        uses: appleboy/ssh-action@1d1b21ca96111b1eb4c03c21c14ebb971d2200f6
        with:
          host: ${{ secrets.HOST }}
          key: ${{ secrets.PRIVATE_KEY }}
          username: ${{ secrets.USER }}
          port: ${{ secrets.PORT }}
          script: /opt/deploy/run
